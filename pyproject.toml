[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dallas-aq-transfer"
version = "0.1.0"
description = "Spatial transfer study of air quality forecasting across North Texas counties"
authors = [{ name = "Moez Ali Khan" }]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "requests>=2.31",
  "scikit-learn>=1.3", "xgboost>=2.0", "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
